title: "Dk Academy"
description: "Learning paths connected to curiosity and meaningful participation. The Academy proposes continuous, personalised learning connected to questions people want to explore and work they want to undertake."
remote_theme: draykerdk/drayker-theme
url: "https://academy.drayker.org"
dk_kicker: "Formation"
dk_subdomain: "academy.drayker.org"
dk_repo: "https://github.com/draykerdk/dk-academy"


# jekyll-remote-theme fetches the shared layout; jekyll-optional-front-matter lets
# README.md render without front matter; the defaults block is what actually applies
# the layout to it. Without all three, GitHub Pages serves bare converted markdown.
plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default

# The official mark, recoloured. Geometry is fixed for every project
# (DRAYKER-MARK.md §2.5); only the globe carries the scope.
dk_accent: "#D6E84A"  # formation: the part that gives off light
