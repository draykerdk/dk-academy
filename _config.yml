title: "Dk Academy"
description: "Study and work, no longer two separate things. Continuous, personalised formation attached to real work: someone learns the thing they are about to contribute to, and contributing is how the learning gets used."
remote_theme: draykerdk/drayker-theme
url: "https://academy.drayker.org"
dk_kicker: "Formation"
dk_subdomain: "academy.drayker.org"
dk_repo: "https://github.com/draykerdk/dk-academy"

# The mark, drawn by the shared engine. The scope colour is the main accent until the
# mark owner assigns one — DRAYKER-MARK.md §7 forbids inventing a new colour.
dk_body: "star"
dk_rings: "hairline"
dk_wedge: "terraform"
dk_accent: "#FF5500"

# jekyll-remote-theme fetches the shared layout; jekyll-optional-front-matter lets
# README.md render without front matter; the defaults block is what actually applies
# the layout to it. Without all three, GitHub Pages serves bare converted markdown.
plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default
dk_sphere: "star"  # formation: the part that gives off light
