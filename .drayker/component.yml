schema_version: 1
component:
  id: academy
  name: Dk Academy
  layer: KNOWLEDGE
  artifact_type: architecture
  problem: "Open projects ask for expertise they do not teach, which quietly restricts them to people who already had access."
  scope:
    - "Public description of formation attached to real functions."
    - "Problem- and project-based, cooperative learning, in the spirit of École 42: authentic problem-led learning for learner autonomy and competence."
    - "Public description of a personalised path, bound to UID."
    - "Public description of a curriculum the member builds or starts from a model and changes whenever they want, revised every three or six months from their own project in project-oriented learning."
    - "Public description of learning shaped for each person's cycles and difficulties, including difficulties of focus and attention."
    - "Public description of learning with Dk without queue or limit; human mentoring, laboratories and the spaces of stations follow the queue of the common floor while capacity is short."
    - "Public description of the first areas foreseen: personal and social intelligence, and Drayker and computer science."
    - "Public description of problem-led learning, with mentoring and feedback."
    - "Public description of Dk as teacher: people learn with Dk and with their project colleagues, in practice."
    - "Public description of learning that returns to the knowledge base."
    - "Public description of the loop from conceptual formation to contextual learning, real function, consequence, Dknowledge and improved formation."
    - "Public description of entry without credentials."
  non_scope:
    - "An accredited course, a certification or a qualification."
    - "For children and adolescents, any participation other than educational and accompanied: no production goals, no economic dependency, and room for curiosity and exploration even when they deliver nothing to a project."
    - "A prerequisite for participating in Drayker, or an automatic certifier."
    - "A promise of placement, funding or employment."
  dependencies:
    - dknowledge
    - uid
    - pap
  implementation:
    level: none
    scope: This repository publishes a charter and open questions; nothing is implemented.
    evidence:
      - type: document
        ref: README.md
  risks:
    - Design language may be mistaken for an available capability.
    - The absence of a specification can leave contributions without a clear target.
    - Connecting learning to real functions must never put production goals on children and adolescents.
  contributions:
    availability: open
    entrypoint: https://github.com/draykerdk/dk-academy/issues
  source_of_truth:
    repository: https://github.com/draykerdk/dk-academy
    path: README.md
  last_reviewed: "2026-10-19"
